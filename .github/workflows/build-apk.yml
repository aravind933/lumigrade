name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK (Bubblewrap TWA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build Bubblewrap Android APK
        env:
          APP_MANIFEST_URL: "https://ais-pre-rgksvfpod2mfbwcjuyrunh-996638534918.asia-east1.run.app/manifest.webmanifest"
        run: |
          mkdir -p twa-build
          cd twa-build

          echo "Initializing Bubblewrap project from live manifest..."
          bubblewrap init --manifest="$APP_MANIFEST_URL" --skipPwaValidation

          echo "Building Android APK..."
          bubblewrap build

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumigrad-hdr-studio-apk
          path: twa-build/*.apk
          retention-days: 14

      - name: Create GitHub Release (on main branch push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LumiGrad HDR10+ Studio v1.0.${{ github.run_number }}
          files: twa-build/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
