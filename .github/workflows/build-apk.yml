name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Fix Bubblewrap tools layout
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Accept licenses & ensure build-tools are present
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # Populate tools folder for Bubblewrap validation
          mkdir -p "$ANDROID_HOME/tools"
          cp -r "$ANDROID_HOME/cmdline-tools/latest/"* "$ANDROID_HOME/tools/" || true
          ls -lah "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Preconfigure Bubblewrap CLI Config
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          bubblewrap doctor

      - name: Generate Android Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=LumiGrad, OU=Engineering, O=LumiGrad, L=Mountain View, ST=CA, C=US"

      - name: Build Android APK from twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "password123"
          BUBBLEWRAP_KEY_PASSWORD: "password123"
        run: |
          echo "=== Pre-generating manifest-checksum.txt ==="
          sha256sum twa-manifest.json | awk '{print $1}' > manifest-checksum.txt
          cat manifest-checksum.txt

          echo "=== Building APK headlessly with BUBBLEWRAP_KEYSTORE_PASSWORD ==="
          bubblewrap build \
            --skipVersionUpgrade \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android

      - name: Find & Stage Generated APK
        run: |
          mkdir -p output-apk
          find . -maxdepth 2 -type f -name "*.apk" -exec cp {} output-apk/ \;
          ls -lah output-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumigrad-hdr-studio-apk
          path: output-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release (on main branch push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LumiGrad HDR10+ Studio v1.0.${{ github.run_number }}
          files: output-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
