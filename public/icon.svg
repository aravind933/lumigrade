<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="hdrGrad" x1="64" y1="256" x2="448" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- CIE 1931 Gamut Triangle stylized (Rec.709 vs Rec.2020) -->
  <path d="M 256 96 L 416 384 L 96 384 Z" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" fill="none" opacity="0.6"/>
  <!-- Expanded BT.2020 HDR Wide Gamut -->
  <path d="M 256 128 L 388 368 L 124 368 Z" stroke="url(#hdrGrad)" stroke-width="6" fill="url(#hdrGrad)" fill-opacity="0.12" filter="url(#softGlow)"/>

  <!-- 3D LUT Cube matrix grid abstract -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <circle cx="256" cy="248" r="80"/>
    <ellipse cx="256" cy="248" rx="80" ry="28"/>
    <line x1="256" y1="168" x2="256" y2="328"/>
  </g>

  <!-- Center dynamic range curve (S-Curve Tone Mapping PQ ST.2084) -->
  <path d="M 160 330 C 220 330, 230 248, 256 248 C 282 248, 292 166, 352 166" 
        stroke="url(#accent)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- HDR10+ Badge -->
  <g transform="translate(146, 404)">
    <rect width="220" height="42" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
      HDR10<tspan fill="#F59E0B">+</tspan> <tspan font-size="14" font-weight="600" fill="#94A3B8">PRO</tspan>
    </text>
  </g>

  <!-- Specular highlight point -->
  <circle cx="352" cy="166" r="8" fill="#FFFBEB" filter="url(#softGlow)"/>
  <circle cx="352" cy="166" r="4" fill="#FFFFFF"/>
</svg>
